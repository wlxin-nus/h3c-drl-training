[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h3c-drl-multiseed-training"
version = "0.4.0"
description = "Refined, temporally unified multi-seed PPO/MAPPO training for H3C BOPTEST baselines"
requires-python = ">=3.10,<3.13"
dependencies = [
  "gymnasium==1.2.1",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pythermalcomfort==3.8.0",
  "requests==2.32.5",
  "stable-baselines3==2.7.0",
  "torch>=2.5,<3",
  "tensorboard>=2.18,<3",
  "wandb>=0.21,<1",
  "portalocker>=3.1,<4",
  "matplotlib>=3.9,<4",
  "nbformat>=5.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[project.scripts]
drl-multiseed = "drl_multiseed.cli:main"

[tool.setuptools.packages.find]
where = ["src", "upstream", "legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
