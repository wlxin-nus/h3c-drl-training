[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h3c-drl-training"
version = "1.0.0"
description = "Reproducible PPO and MAPPO training for three BOPTEST building cases"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license-files = ["LICENSE"]
license = "LicenseRef-Revised-BSD-H3C"
authors = [{name = "H3C DRL Training Contributors"}]
keywords = ["reinforcement-learning", "building-control", "BOPTEST", "PPO", "MAPPO"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium==1.2.1",
  "matplotlib==3.10.7",
  "nbformat==5.10.4",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "portalocker==3.2.0",
  "pythermalcomfort==3.8.0",
  "requests==2.32.5",
  "stable-baselines3==2.7.0",
  "tensorboard==2.20.0",
  "torch==2.9.0",
  "wandb==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.2",
]

[project.scripts]
h3c-drl = "drl_multiseed.cli:main"

[project.urls]
Repository = "https://github.com/wlxin-nus/h3c-drl-training"
Documentation = "https://github.com/wlxin-nus/h3c-drl-training#readme"
Issues = "https://github.com/wlxin-nus/h3c-drl-training/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drl_multiseed = ["data/*.json", "data/cases/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires a live BOPTEST service"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
